apiVersion: v1
kind: Namespace
metadata:
  name: radiology
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: radiology
  annotations:
    azure.workload.identity/client-id: "__BACKEND_IDENTITY_CLIENT_ID__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: radiology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: __CONTAINER_REGISTRY__/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: "__APPLICATIONINSIGHTS_CONNECTION_STRING__"
            - name: AZURE_CLIENT_ID
              value: "__BACKEND_IDENTITY_CLIENT_ID__"
            - name: AZURE_TENANT_ID
              value: "__AZURE_TENANT_ID__"
            - name: CASE_STORE
              value: cosmos
            - name: CORS_ORIGINS
              value: "__FRONTEND_URL__"
            - name: COSMOS_CONTAINER
              value: "__COSMOS_CONTAINER_NAME__"
            - name: COSMOS_DATABASE
              value: "__COSMOS_DATABASE_NAME__"
            - name: COSMOS_ENDPOINT
              value: "__COSMOS_ENDPOINT__"
            - name: DEVELOPMENT_MODE
              value: "false"
            - name: ENABLE_API_DOCS
              value: "false"
            - name: ENTRA_CLIENT_ID
              value: "__ENTRA_CLIENT_ID__"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: radiology
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: radiology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: __CONTAINER_REGISTRY__/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: radiology
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radiology
  namespace: radiology
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - __FRONTEND_HOST__
      secretName: frontend-tls
  rules:
    - host: __FRONTEND_HOST__
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80